name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libeigen3-dev libgtest-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DMCA_BUILD_TESTS=ON -DMCA_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure P8-39 exception regressions
        run: cmake -S tests/p8_39 -B build-p8-39 -G Ninja
      - name: Build P8-39 exception regressions
        run: cmake --build build-p8-39 --parallel
      - name: Test P8-39 exception regressions
        run: ctest --test-dir build-p8-39 --output-on-failure
      - name: Configure P8-40 projected-gradient regressions
        run: cmake -S tests/p8_40 -B build-p8-40 -G Ninja
      - name: Build P8-40 projected-gradient regressions
        run: cmake --build build-p8-40 --parallel
      - name: Test P8-40 projected-gradient regressions
        run: ctest --test-dir build-p8-40 --output-on-failure
      - name: Configure P8-41 callback exception regressions
        run: cmake -S tests/p8_41 -B build-p8-41 -G Ninja
      - name: Build P8-41 callback exception regressions
        run: cmake --build build-p8-41 --parallel
      - name: Test P8-41 callback exception regressions
        run: ctest --test-dir build-p8-41 --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: vcpkg install eigen3 gtest --triplet x64-windows
      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) { throw "vcpkg toolchain not found: $toolchain" }
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DMCA_BUILD_TESTS=ON -DMCA_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Configure P8-39 exception regressions
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S tests/p8_39 -B build-p8-39 -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
      - name: Build P8-39 exception regressions
        run: cmake --build build-p8-39 --config Release
      - name: Test P8-39 exception regressions
        run: ctest --test-dir build-p8-39 -C Release --output-on-failure
      - name: Configure P8-40 projected-gradient regressions
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S tests/p8_40 -B build-p8-40 -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
      - name: Build P8-40 projected-gradient regressions
        run: cmake --build build-p8-40 --config Release
      - name: Test P8-40 projected-gradient regressions
        run: ctest --test-dir build-p8-40 -C Release --output-on-failure
      - name: Configure P8-41 callback exception regressions
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S tests/p8_41 -B build-p8-41 -A x64 `"-DCMAKE_TOOLCHAIN_FILE=$toolchain`"
      - name: Build P8-41 callback exception regressions
        run: cmake --build build-p8-41 --config Release
      - name: Test P8-41 callback exception regressions
        run: ctest --test-dir build-p8-41 -C Release --output-on-failure
