name: ethercat-igh-compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  igh-1-6-13-api-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate opt-in Linux SIL harness syntax
        run: |
          bash -n scripts/ethercat_sil/run_kickcat_igh_veth_discovery.sh
          bash -n scripts/ethercat_sil/run_kickcat_igh_fault_duration_matrix.sh
          bash -n scripts/ethercat_sil/run_kickcat_igh_multi_slave_fault_isolation.sh
          bash -n scripts/ethercat_sil/run_kickcat_igh_multi_slave_communication_fault.sh
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
      - name: Fetch pinned IgH 1.6.13 headers
        run: |
          git clone --depth 1 --branch 1.6.13 https://gitlab.com/etherlab.org/ethercat.git /tmp/ethercat
          test "$(git -C /tmp/ethercat rev-parse HEAD)" = "61cc654f5b721ddd54df0f58bdd34106d91c5359"
      - name: Compile MCA IgH adapter against pinned API
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -DMCA_ENABLE_IGH=1 -Iinclude -I/usr/include/eigen3 -I/tmp/ethercat/include \
            -c src/hardware/ethercat_igh_adapter.cpp -o /tmp/ethercat_igh_adapter.o
      - name: Compile cyclic KickCAT SIL harness against pinned API
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -DMCA_ENABLE_IGH=1 -Iinclude -I/usr/include/eigen3 -I/tmp/ethercat/include \
            -fsyntax-only tests/integration/ethercat_igh_kickcat_cyclic_sil.cpp
      - name: Compile multi-slave cyclic SIL harness against pinned API
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -DMCA_ENABLE_IGH=1 -Iinclude -I/usr/include/eigen3 -I/tmp/ethercat/include \
            -fsyntax-only tests/integration/ethercat_igh_kickcat_multi_slave_cyclic_sil.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -I/tmp/ethercat/include -fsyntax-only \
            scripts/ethercat_sil/coe_sdo_readback.cpp
      - name: Fetch pinned KickCAT simulator-control API
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leducp/KickCAT.git /tmp/KickCAT-control
          git -C /tmp/KickCAT-control checkout --detach cb2e1a192ac11ffaa58f08945053b8129abf94cb
          test -f /tmp/KickCAT-control/lib/include/kickcat/SimulatorControl.h
      - name: Resolve pinned KickCAT Ingenia ESI PDO expectation
        run: |
          python3 scripts/ethercat_esi/esi_to_profile.py \
            /tmp/KickCAT-control/simulation/slave_configs/ecat402-drive.xml \
            --product-code 0x03b11002 \
            --rx-pdo 0x1600 --tx-pdo 0x1a00 \
            --treat-slot-dependent-indices-as-literal \
            --emit-pdo-snapshot -o /tmp/kickcat-ingenia-pdo-snapshot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("/tmp/kickcat-ingenia-pdo-snapshot.json").read_text())
          assert snapshot["identity"] == {"vendor_id": 0x29c, "product_code": 0x03b11002}
          assert snapshot["selection_policy"] == "literal_base_indices_explicit_override"
          assert [(item["assignment_object"], item["assignment_position"], item["pdo_index"])
                  for item in snapshot["assignments"]] == [
              (0x1c12, 1, 0x1600), (0x1c13, 1, 0x1a00)]
          assert [(item["sync_manager"], item["direction"], item["pdo_index"],
                   item["entry_position"], item["raw_mapping_entry"])
                  for item in snapshot["mappings"]] == [
              (2, "rx", 0x1600, 1, 0x60400010),
              (2, "rx", 0x1600, 2, 0x607a0020),
              (2, "rx", 0x1600, 3, 0x60ff0020),
              (2, "rx", 0x1600, 4, 0x60600008),
              (3, "tx", 0x1a00, 1, 0x60410010),
              (3, "tx", 0x1a00, 2, 0x60640020),
              (3, "tx", 0x1a00, 3, 0x606c0020),
              (3, "tx", 0x1a00, 4, 0x60610008)]
          print("PASS: pinned KickCAT Ingenia ESI resolved to the CoE-observed PDO profile")
          PY
      - name: Build pinned KickCAT core library
        run: |
          cmake -S /tmp/KickCAT-control -B /tmp/KickCAT-control/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_MASTER_EXAMPLES=OFF \
            -DBUILD_SLAVE_EXAMPLES=OFF \
            -DBUILD_UNIT_TESTS=OFF \
            -DBUILD_SIMULATION=OFF \
            -DBUILD_TOOLS=OFF \
            -DENABLE_ESI_PARSER=OFF
          cmake --build /tmp/KickCAT-control/build --target kickcat --parallel 2
          test -f /tmp/KickCAT-control/build/lib/libkickcat.a
      - name: Compile multi-slave link-fault SIL with KickCAT control enabled
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -DMCA_ENABLE_IGH=1 -DMCA_ENABLE_KICKCAT_SIM_CONTROL=1 \
            -Iinclude -I/usr/include/eigen3 -I/tmp/ethercat/include \
            -I/tmp/KickCAT-control/lib/include \
            -fsyntax-only tests/integration/ethercat_igh_kickcat_multi_slave_cyclic_sil.cpp
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -I/tmp/KickCAT-control/lib/include \
            tests/integration/ethercat_kickcat_sim_control_shm.cpp \
            /tmp/KickCAT-control/build/lib/libkickcat.a -pthread -lrt \
            -o /tmp/mca-ethercat-control-shm
          control_name="/mca_ethercat_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          /tmp/mca-ethercat-control-shm init "$control_name"
          /tmp/mca-ethercat-control-shm unlink "$control_name"
