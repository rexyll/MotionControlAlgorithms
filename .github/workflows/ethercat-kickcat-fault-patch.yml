name: ethercat-kickcat-fault-patch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  patch-pinned-kickcat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned KickCAT source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leducp/KickCAT.git /tmp/KickCAT
          git -C /tmp/KickCAT checkout --detach cb2e1a192ac11ffaa58f08945053b8129abf94cb
      - name: Validate and apply DS402 fault-injection patch
        run: |
          python3 scripts/ethercat_sil/apply_kickcat_ds402_fault_patch.py /tmp/KickCAT
          # Validate the first application itself; a second invocation must only
          # prove idempotence and must not be required to upgrade v1 semantics.
          python3 - <<'PY'
          from pathlib import Path
          header = Path("/tmp/KickCAT/lib/simulation/include/kickcat/simulation/devices/Ds402Motor.h").read_text()
          app = Path("/tmp/KickCAT/lib/simulation/src/DeviceApp.cc").read_text()
          assert "fault_after_cycles" in header
          assert "fault_reaction_cycles" in app
          state_machine = header.split("void stepStateMachine(uint16_t control_word)", 1)[1]
          assert "status_word_value_ == OPERATION_ENABLED" in state_machine
          assert "(control_word & 0x000FU) == 0x000FU" in state_machine
          assert "const bool fault_reset_edge =" in state_machine
          assert state_machine.count("++cycle_count_;") == 1
          assert "last_control_word_ = control_word;\\n            ++cycle_count_;" not in state_machine
          PY
          before="$(git -C /tmp/KickCAT diff --binary | sha256sum)"
          python3 scripts/ethercat_sil/apply_kickcat_ds402_fault_patch.py /tmp/KickCAT
          after="$(git -C /tmp/KickCAT diff --binary | sha256sum)"
          test "$before" = "$after"
          git -C /tmp/KickCAT diff --check
          grep -q 'fault_after_cycles' /tmp/KickCAT/lib/simulation/include/kickcat/simulation/devices/Ds402Motor.h
          grep -q 'fault_reaction_cycles' /tmp/KickCAT/lib/simulation/src/DeviceApp.cc
      - name: Compile patched KickCAT DS402 simulator sources
        run: |
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -I/tmp/KickCAT/lib/include -I/tmp/KickCAT/lib/master/include \
            -I/tmp/KickCAT/lib/slave/include -I/tmp/KickCAT/lib/simulation/include \
            -fsyntax-only /tmp/KickCAT/lib/simulation/src/DeviceApp.cc
          printf '#include "kickcat/simulation/devices/Ds402Motor.h"\\n' | \
            g++ -std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
              -I/tmp/KickCAT/lib/include -I/tmp/KickCAT/lib/master/include \
              -I/tmp/KickCAT/lib/slave/include -I/tmp/KickCAT/lib/simulation/include \
              -x c++ -fsyntax-only -
