name: gazebo-adapter

concurrency:
  group: gazebo-adapter-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "gazebo/mca_gazebo_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/gazebo-adapter.yml"
  pull_request:
    paths:
      - "gazebo/mca_gazebo_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/gazebo-adapter.yml"

jobs:
  gazebo-harmonic-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install Gazebo Harmonic development dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg cmake g++ pkg-config cppzmq-dev
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(. /etc/os-release && echo ${UBUNTU_CODENAME}) main" > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y --no-install-recommends gz-harmonic libgz-sim8-dev libgz-plugin2-dev libgz-common5-dev libgz-math7-dev libgz-transport13-dev libgz-msgs10-dev ros-jazzy-ros-gz-bridge
      - name: Configure Gazebo adapter
        shell: bash
        run: cmake -S gazebo/mca_gazebo_adapter -B build/gazebo-adapter -DCMAKE_BUILD_TYPE=Release
      - name: Build Gazebo adapter
        shell: bash
        run: cmake --build build/gazebo-adapter --parallel 2
      - name: Run headless Gazebo plugin smoke test
        shell: bash
        run: |
          set +e
          GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}" \
            timeout 15s gz sim -s -r -v 4 gazebo/mca_gazebo_adapter/test/worlds/single_axis_smoke.sdf > gazebo-smoke.log 2>&1
          status=$?
          set -e
          cat gazebo-smoke.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo "Gazebo exited unexpectedly with status $status"
            exit "$status"
          fi
          if grep -Eqi "Failed to load system plugin|Unable to load plugin|Error Code 11" gazebo-smoke.log; then
            echo "Gazebo reported a plugin loading error"
            exit 1
          fi
          if ! grep -Fq "mca_gazebo_adapter::ScalarJointSystem" gazebo-smoke.log; then
            echo "Expected MCA scalar joint plugin name was not found in Gazebo logs"
            exit 1
          fi
      - name: Run ROS 2 ↔ Gazebo bridge command/state smoke test
        shell: bash
        run: |
          set -eo pipefail
          export GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}"
          export ROS_DOMAIN_ID=37
          # GitHub-hosted jobs run in isolated containers. Keep Gazebo Sim,
          # the Gazebo CLI, and ros_gz_bridge on Gazebo Transport's default
          # partition; the plugin reports that its node remains on the default
          # partition even when GZ_PARTITION is exported by this shell.
          topic_prefix="/mca/single_axis_smoke/joint/axis_joint"

          # Start Gazebo before sourcing ROS 2: ROS Jazzy prepends a minimal
          # gz-tools-vendor CLI to PATH that does not provide the "sim" command.
          gazebo_executable="$(command -v gz)"
          gazebo_path="$PATH"
          gazebo_ld_library_path="${LD_LIBRARY_PATH:-}"
          gazebo_cli() {
            env PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" \
              "$gazebo_executable" "$@"
          }
          echo "System Gazebo CLI: $gazebo_executable"
          echo "System Gazebo CLI libraries: ${gazebo_ld_library_path}"
          gz sim -s -r gazebo/mca_gazebo_adapter/test/worlds/single_axis_smoke.sdf > gazebo-transport.log 2>&1 &
          gz_pid=$!
          bridge_pid=""
          publisher_pid=""
          velocity_pid=""
          cleanup() {
            if [ -n "$velocity_pid" ]; then
              kill "$velocity_pid" 2>/dev/null || true
              wait "$velocity_pid" 2>/dev/null || true
            fi
            if [ -n "${command_echo_pid:-}" ]; then
              kill "$command_echo_pid" 2>/dev/null || true
              wait "$command_echo_pid" 2>/dev/null || true
            fi
            if [ -n "$publisher_pid" ]; then
              kill "$publisher_pid" 2>/dev/null || true
              wait "$publisher_pid" 2>/dev/null || true
            fi
            if [ -n "$bridge_pid" ]; then
              kill "$bridge_pid" 2>/dev/null || true
              wait "$bridge_pid" 2>/dev/null || true
            fi
            kill "$gz_pid" 2>/dev/null || true
            wait "$gz_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3
          echo "=== Gazebo topics after plugin startup ==="
          gazebo_cli topic -l || true
          echo "=== Command topic transport info ==="
          gazebo_cli topic -i -t "${topic_prefix}/cmd_effort" || true

          # ROS setup scripts expect unset variables to be tolerated.
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          echo "gz command after ROS setup: $(command -v gz)"
          echo "GZ_PARTITION after ROS setup: ${GZ_PARTITION:-<unset>}"

          # Bridge effort from ROS 2 into Gazebo and velocity back into ROS 2.
          ros2 run ros_gz_bridge parameter_bridge \
            "${topic_prefix}/cmd_effort@std_msgs/msg/Float64]gz.msgs.Double" \
            "${topic_prefix}/state/velocity@std_msgs/msg/Float64[gz.msgs.Double" \
            > ros-gz-bridge.log 2>&1 &
          bridge_pid=$!
          sleep 3

          # Start effort first, then observe state while the command is still active.
          # This avoids accepting only startup/idle samples as proof of actuation.
          # Observe the Gazebo command topic independently of the plugin callback.
          # If this sees the effort, ROS->GZ conversion and transport publication work.
          timeout 4s env PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" "$gazebo_executable" topic -e -t "${topic_prefix}/cmd_effort" > gz-command-echo.log 2>&1 &
          command_echo_pid=$!
          timeout 4s ros2 topic pub --rate 20 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 1.0}" > command-publisher.log 2>&1 &
          publisher_pid=$!
          sleep 1
          timeout 3s ros2 topic echo "${topic_prefix}/state/velocity" std_msgs/msg/Float64 > velocity.log 2>&1 &
          velocity_pid=$!
          wait "$publisher_pid" || true
          wait "$velocity_pid" || true

          echo "=== Command topic transport info after ROS publisher ==="
          gazebo_cli topic -i -t "${topic_prefix}/cmd_effort" || true
          echo "=== Gazebo command topic echo ==="
          cat gz-command-echo.log
          echo "=== ROS publisher log ==="
          cat command-publisher.log
          echo "=== Bridge log before assertions ==="
          cat ros-gz-bridge.log
          echo "=== Gazebo log before assertions ==="
          cat gazebo-transport.log
          cat velocity.log

          # Diagnostic only: bypass ROS-GZ bridge to distinguish transport ingress
          # from the physics / JointForceCmd path. This never affects the ROS-path
          # acceptance result above, which remains based only on velocity.log.
          set +e
          timeout 2s env PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" "$gazebo_executable" topic -t "${topic_prefix}/cmd_effort" -m gz.msgs.Double -p "data: 1.0" > native-publisher.log 2>&1 &
          native_publisher_pid=$!
          timeout 2s ros2 topic echo "${topic_prefix}/state/velocity" std_msgs/msg/Float64 > native-velocity.log 2>&1 &
          native_velocity_pid=$!
          wait "$native_publisher_pid"
          wait "$native_velocity_pid"
          set -e
          echo "=== Native Gazebo transport diagnostic publisher ==="
          cat native-publisher.log
          echo "=== Velocity during native Gazebo command diagnostic (not acceptance) ==="
          cat native-velocity.log
          echo "=== Gazebo log after native command diagnostic ==="
          cat gazebo-transport.log

          if ! grep -Eq 'data: [-+]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][-+]?[0-9]+)?' velocity.log; then
            echo "No ROS 2 velocity state was observed through ros_gz_bridge"
            echo "=== Gazebo topic list at failure ==="
            gazebo_cli topic -l || true
            echo "=== Command topic transport info at failure ==="
            gazebo_cli topic -i -t "${topic_prefix}/cmd_effort" || true
            echo "=== Gazebo transport log ==="
            cat gazebo-transport.log
            echo "=== ROS/Gazebo bridge log ==="
            cat ros-gz-bridge.log
            echo "=== ROS command publisher log ==="
            cat command-publisher.log
            exit 1
          fi
          if ! awk '/data:/{v=$2; if (v+0 > 1e-5 || v+0 < -1e-5) {found=1}} END{exit(found ? 0 : 1)}' velocity.log; then
            echo "ROS 2 effort command did not produce velocity above the 1e-5 threshold"
            cat gazebo-transport.log
            cat ros-gz-bridge.log
            cat command-publisher.log
            exit 1
          fi
          echo "ROS 2 ↔ Gazebo bridge command/state path produced velocity above 1e-5"
