name: gazebo-adapter

concurrency:
  group: gazebo-adapter-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "gazebo/mca_gazebo_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/gazebo-adapter.yml"
  pull_request:
    paths:
      - "gazebo/mca_gazebo_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/gazebo-adapter.yml"

jobs:
  gazebo-harmonic-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install Gazebo Harmonic development dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg cmake g++ pkg-config cppzmq-dev strace
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(. /etc/os-release && echo ${UBUNTU_CODENAME}) main" > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y --no-install-recommends gz-harmonic libgz-sim8-dev libgz-plugin2-dev libgz-common5-dev libgz-math7-dev libgz-transport13-dev libgz-msgs10-dev ros-jazzy-ros-gz-bridge
      - name: Configure Gazebo adapter
        shell: bash
        run: cmake -S gazebo/mca_gazebo_adapter -B build/gazebo-adapter -DCMAKE_BUILD_TYPE=Release
      - name: Build Gazebo adapter
        shell: bash
        run: cmake --build build/gazebo-adapter --parallel 2
      - name: Run ROS 2 ↔ Gazebo bridge command/state smoke test
        shell: bash
        run: |
          set -eo pipefail
          export GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}"
          export ROS_DOMAIN_ID=37
          export GZ_PARTITION="mca-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          topic_prefix="/mca/single_axis_smoke/joint/axis_joint"
          gazebo_executable="$(command -v gz)"
          gazebo_path="$PATH"
          gazebo_ld_library_path="${LD_LIBRARY_PATH:-}"
          gazebo_cli() {
            env GZ_PARTITION="$GZ_PARTITION" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" "$gazebo_executable" "$@"
          }
          echo "Gazebo Transport partition: $GZ_PARTITION"
          echo "System Gazebo CLI: $gazebo_executable"
          echo "System Gazebo CLI libraries: $gazebo_ld_library_path"

          setsid env GZ_PARTITION="$GZ_PARTITION" GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" \
            strace -ff -tt -T -s 160 -o gazebo-startup.strace "$gazebo_executable" sim -s -r -v 4 gazebo/mca_gazebo_adapter/test/worlds/single_axis_smoke.sdf > gazebo-transport.log 2>&1 &
          gz_pid=$!
          bridge_pid=""
          publisher_pid=""
          velocity_pid=""
          command_echo_pid=""
          transport_probe_pid=""
          cleanup() {
            for pid in "$velocity_pid" "$command_echo_pid" "$publisher_pid" "$transport_probe_pid"; do
              [ -n "$pid" ] || continue
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
            for pid in ${bridge_pid:-}; do
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
            kill -INT -- "-$gz_pid" 2>/dev/null || true
            for _ in $(seq 1 5); do
              kill -0 -- "-$gz_pid" 2>/dev/null || break
              sleep 1
            done
            kill -KILL -- "-$gz_pid" 2>/dev/null || true
            wait "$gz_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          expected_state_topics=(
            "${topic_prefix}/state/position"
            "${topic_prefix}/state/velocity"
            "${topic_prefix}/state/acceleration"
            "${topic_prefix}/state/time"
            "${topic_prefix}/state/step_index"
          )
          plugin_topics_ready=false
          topic_list=""
          for _ in $(seq 1 60); do
            topic_list="$(gazebo_cli topic -l 2>/dev/null || true)"
            missing_state_topics=()
            for expected_topic in "${expected_state_topics[@]}"; do
              printf '%s\n' "$topic_list" | grep -Fxq "$expected_topic" || missing_state_topics+=("$expected_topic")
            done
            if [ "${#missing_state_topics[@]}" -eq 0 ]; then
              plugin_topics_ready=true
              break
            fi
            kill -0 "$gz_pid" 2>/dev/null || break
            sleep 1
          done
          echo "=== Gazebo startup process ==="
          ps -o pid,ppid,pgid,stat,args -p "$gz_pid" || true
          echo "=== Gazebo adapter state topics ==="
          printf '%s\n' "${topic_list:-<unavailable>}"
          if [ "$plugin_topics_ready" != true ]; then
            echo "Gazebo bridge-test server did not advertise all five MCA adapter state topics"
            printf 'Still missing: %s\n' "${missing_state_topics[*]}"
            cat gazebo-transport.log || true
            exit 1
          fi
          echo "MCA adapter state publishers discovered through Gazebo Transport"
          gazebo_cli topic -l || true

          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          echo "gz command after ROS setup: $(command -v gz)"
          echo "GZ_PARTITION after ROS setup: ${GZ_PARTITION:-<unset>}"

          env GZ_PARTITION="$GZ_PARTITION" ros2 run ros_gz_bridge parameter_bridge \
            "${topic_prefix}/cmd_effort@std_msgs/msg/Float64]gz.msgs.Double" --ros-args -r __node:=mca_ros_to_gz_bridge > ros-to-gz-bridge.log 2>&1 &
          ros_to_gz_bridge_pid=$!
          env GZ_PARTITION="$GZ_PARTITION" ros2 run ros_gz_bridge parameter_bridge \
            "${topic_prefix}/state/velocity@std_msgs/msg/Float64[gz.msgs.Double" --ros-args -r __node:=mca_gz_to_ros_bridge > gz-to-ros-bridge.log 2>&1 &
          gz_to_ros_bridge_pid=$!
          bridge_pid="$ros_to_gz_bridge_pid $gz_to_ros_bridge_pid"

          bridge_ready=false
          for _ in $(seq 1 20); do
            ros_subscribers="$(ros2 topic info -v "${topic_prefix}/cmd_effort" 2>/dev/null | awk '/Subscription count:/{print $3; exit}')"
            bridge_mapping_ready=false
            grep -Fq "Creating ROS->GZ Bridge:" ros-to-gz-bridge.log && bridge_mapping_ready=true
            if [ "${ros_subscribers:-0}" -ge 1 ] && [ "$bridge_mapping_ready" = true ]; then
              bridge_ready=true
              break
            fi
            sleep 1
          done
          echo "=== Bridge readiness before command publication ==="
          echo "ROS command subscribers: ${ros_subscribers:-0}"
          echo "ROS-to-Gazebo bridge mapping ready: $bridge_mapping_ready"
          if [ "$bridge_ready" != true ]; then
            echo "ROS-to-Gazebo bridge did not initialize before command publication"
            ros2 topic info -v "${topic_prefix}/cmd_effort" || true
            cat ros-to-gz-bridge.log || true
            exit 1
          fi

          # The ROS graph being ready is not sufficient: the bridge can exist
          # while its Gazebo Transport publisher has not yet discovered the
          # adapter subscription. Wait for the actual Gazebo-side subscriber
          # before sending the first command, otherwise the first and only
          # diagnostic bridge message can be dropped before plugin discovery.
          gazebo_command_subscriber_ready=false
          gazebo_command_topic_info=""
          for _ in $(seq 1 20); do
            gazebo_command_topic_info="$(gazebo_cli topic -i -t "${topic_prefix}/cmd_effort" 2>/dev/null || true)"
            # Gazebo Harmonic topic -i lists endpoint sections instead of
            # a numeric "Subscriber count" field. Count TCP endpoints only
            # inside Subscribers, excluding the bridge publisher endpoint.
            if printf '%s\n' "$gazebo_command_topic_info" | awk '
              /^Subscribers \[/ { in_subscribers=1; next }
              /^[^[:space:]]/ { if (in_subscribers) in_subscribers=0 }
              in_subscribers && /tcp:\/\// { found=1 }
              END { exit(found ? 0 : 1) }
            '; then
              gazebo_command_subscriber_ready=true
              break
            fi
            sleep 1
          done
          echo "=== Gazebo command topic readiness before command publication ==="
          printf '%s\n' "${gazebo_command_topic_info:-<unavailable>}"
          if [ "$gazebo_command_subscriber_ready" != true ]; then
            echo "Gazebo adapter command subscriber was not discovered before command publication"
            exit 1
          fi

          echo "=== Bridge logs after startup ==="
          cat ros-to-gz-bridge.log || true
          cat gz-to-ros-bridge.log || true

          # Start the state subscriber before any command is published. This
          # removes the previous one-second race in which the command publisher
          # could already be active while the ROS-side state subscriber was not.
          timeout 10s ros2 topic echo "${topic_prefix}/state/velocity" std_msgs/msg/Float64 > velocity.log 2>&1 &
          velocity_pid=$!
          sleep 1

          # Diagnostic probe must be alive before command publication so it can
          # independently prove Gazebo Transport delivery on the same partition.
          timeout 12s env GZ_PARTITION="$GZ_PARTITION" build/gazebo-adapter/mca_transport_subscriber_probe "${topic_prefix}/cmd_effort" > transport-probe.log 2>&1 &
          transport_probe_pid=$!
          sleep 1

          timeout 12s ros2 topic pub --rate 100 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 1.0}" > command-publisher.log 2>&1 &
          publisher_pid=$!

          for _ in $(seq 1 10); do
            grep -Fq "Passing message from ROS std_msgs/msg/Float64 to Gazebo gz.msgs.Double" ros-to-gz-bridge.log && break
            sleep 1
          done
          echo "=== ROS-to-Gazebo first-message status ==="
          grep -F "Passing message from ROS std_msgs/msg/Float64 to Gazebo gz.msgs.Double" ros-to-gz-bridge.log || true

          timeout 10s env GZ_PARTITION="$GZ_PARTITION" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" "$gazebo_executable" topic -e -t "${topic_prefix}/cmd_effort" > gz-command-echo.log 2>&1 &
          command_echo_pid=$!

          wait "$publisher_pid" || true
          wait "$velocity_pid" || true
          wait "$transport_probe_pid" || true

          echo "=== ROS command topic graph after publisher ==="
          ros2 topic info -v "${topic_prefix}/cmd_effort" || true
          echo "=== Gazebo command topic echo ==="
          cat gz-command-echo.log || true
          echo "=== Independent C++ Gazebo Transport subscriber probe (diagnostic only) ==="
          cat transport-probe.log || true
          echo "=== ROS publisher log ==="
          cat command-publisher.log || true
          echo "=== ROS -> Gazebo bridge log ==="
          cat ros-to-gz-bridge.log || true
          echo "=== Gazebo -> ROS bridge log ==="
          cat gz-to-ros-bridge.log || true
          echo "=== Gazebo runtime log ==="
          cat gazebo-transport.log || true
          echo "=== ROS velocity samples ==="
          cat velocity.log || true

          # Keep the four real E2E assertions unchanged. Diagnostic ordering is
          # bridge -> plugin callback -> non-zero force -> ROS velocity, so a
          # failure identifies the broken layer without weakening acceptance.
          if ! grep -Fq "Passing message from ROS std_msgs/msg/Float64 to Gazebo gz.msgs.Double" ros-to-gz-bridge.log; then
            echo "ROS-to-Gazebo bridge did not confirm forwarding a command message"
            exit 1
          fi
          if ! grep -Fq "MCA Gazebo adapter received typed transport effort command=1" gazebo-transport.log; then
            echo "Gazebo adapter did not log receipt of the ROS-bridged effort command"
            exit 1
          fi
          if ! grep -Fq "MCA Gazebo adapter applied non-zero JointForceCmd=" gazebo-transport.log; then
            echo "Gazebo adapter did not log application of a non-zero JointForceCmd"
            exit 1
          fi
          if ! grep -Eq 'data: [-+]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][-+]?[0-9]+)?' velocity.log; then
            echo "No ROS 2 velocity state was observed through ros_gz_bridge"
            exit 1
          fi
          if ! awk '/data:/{v=$2; if (v+0 > 1e-5 || v+0 < -1e-5) {found=1}} END{exit(found ? 0 : 1)}' velocity.log; then
            echo "ROS 2 effort command did not produce velocity above the 1e-5 threshold"
            echo "=== Gazebo process and thread state at E2E failure ==="
            ps -eLo pid,ppid,tid,stat,pcpu,wchan:32,comm,args | grep -E '[g]z sim|[g]z-sim|[g]zserver|[s]trace' || true
            echo "=== Gazebo server thread wait channels ==="
            for task_file in /proc/"$gz_pid"/task/*/wchan; do
              [ -r "$task_file" ] || continue
              printf '%s: ' "$task_file"
              cat "$task_file" || true
            done
            echo "=== Gazebo startup strace tails at E2E failure ==="
            for trace_file in gazebo-startup.strace*; do
              [ -f "$trace_file" ] || continue
              echo "--- $trace_file ---"
              tail -n 100 "$trace_file"
            done
            exit 1
          fi
          echo "ROS 2 ↔ Gazebo bridge command/state path passed: bridge forwarding, plugin callback, non-zero JointForceCmd, and velocity > 1e-5"
