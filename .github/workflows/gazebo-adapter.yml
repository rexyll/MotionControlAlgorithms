name: gazebo-adapter

concurrency:
  group: gazebo-adapter-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "gazebo/mca_gazebo_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/gazebo-adapter.yml"
  pull_request:
    paths:
      - "gazebo/mca_gazebo_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/gazebo-adapter.yml"

jobs:
  gazebo-harmonic-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install Gazebo Harmonic development dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg cmake g++ pkg-config cppzmq-dev
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(. /etc/os-release && echo ${UBUNTU_CODENAME}) main" > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y --no-install-recommends gz-harmonic libgz-sim8-dev libgz-plugin2-dev libgz-common5-dev libgz-math7-dev libgz-transport13-dev libgz-msgs10-dev ros-jazzy-ros-gz-bridge
      - name: Configure Gazebo adapter
        shell: bash
        run: cmake -S gazebo/mca_gazebo_adapter -B build/gazebo-adapter -DCMAKE_BUILD_TYPE=Release
      - name: Build Gazebo adapter
        shell: bash
        run: cmake --build build/gazebo-adapter --parallel 2
      - name: Run ROS 2 ↔ Gazebo bridge command/state smoke test
        shell: bash
        run: |
          set -eo pipefail
          export GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}"
          export ROS_DOMAIN_ID=37
          export GZ_PARTITION="mca-ci-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          topic_prefix="/mca/single_axis_smoke/joint/axis_joint"
          gazebo_executable="$(command -v gz)"
          gazebo_path="$PATH"
          gazebo_ld_library_path="${LD_LIBRARY_PATH:-}"
          gazebo_cli() {
            env GZ_PARTITION="$GZ_PARTITION" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" "$gazebo_executable" "$@"
          }
          echo "Gazebo Transport partition: $GZ_PARTITION"
          echo "System Gazebo CLI: $gazebo_executable"
          echo "System Gazebo CLI libraries: $gazebo_ld_library_path"

          # Run Gazebo without ptrace instrumentation. strace can stop every
          # traced thread at syscall boundaries and perturb the transport
          # receiver we are trying to diagnose.
          env GZ_VERBOSE=1 GZ_PARTITION="$GZ_PARTITION" GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" \
            "$gazebo_executable" sim -s -r -v 4 gazebo/mca_gazebo_adapter/test/worlds/single_axis_smoke.sdf > gazebo-transport.log 2>&1 &
          gz_pid=$!
          bridge_pid=""
          publisher_pid=""
          velocity_pid=""
          acceleration_pid=""
          post_reset_velocity_pid=""
          post_reset_gz_velocity_pid=""
          post_reset_publisher_pid=""
          post_reset_zero_publisher_pid=""
          command_echo_pid=""
          transport_probe_pid=""
          cleanup() {
            for pid in "$velocity_pid" "$acceleration_pid" "$post_reset_velocity_pid" "$post_reset_gz_velocity_pid" "$post_reset_publisher_pid" "$post_reset_zero_publisher_pid" "$command_echo_pid" "$publisher_pid" "$transport_probe_pid"; do
              [ -n "$pid" ] || continue
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
            for pid in ${bridge_pid:-}; do
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
            if [ -n "${gz_pid:-}" ]; then
              kill -INT "$gz_pid" 2>/dev/null || true
              for _ in $(seq 1 5); do
                kill -0 "$gz_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$gz_pid" 2>/dev/null || true
              wait "$gz_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          expected_state_topics=(
            "${topic_prefix}/state/position"
            "${topic_prefix}/state/velocity"
            "${topic_prefix}/state/acceleration"
            "${topic_prefix}/state/time"
            "${topic_prefix}/state/step_index"
          )
          plugin_topics_ready=false
          topic_list=""
          for _ in $(seq 1 60); do
            topic_list="$(gazebo_cli topic -l 2>/dev/null || true)"
            missing_state_topics=()
            for expected_topic in "${expected_state_topics[@]}"; do
              printf '%s\n' "$topic_list" | grep -Fxq "$expected_topic" || missing_state_topics+=("$expected_topic")
            done
            if [ "${#missing_state_topics[@]}" -eq 0 ]; then
              plugin_topics_ready=true
              break
            fi
            kill -0 "$gz_pid" 2>/dev/null || break
            sleep 1
          done
          echo "=== Gazebo startup process ==="
          ps -o pid,ppid,pgid,stat,args -p "$gz_pid" || true
          echo "=== Gazebo adapter state topics ==="
          printf '%s\n' "${topic_list:-<unavailable>}"
          if [ "$plugin_topics_ready" != true ]; then
            echo "Gazebo bridge-test server did not advertise all five MCA adapter state topics"
            printf 'Still missing: %s\n' "${missing_state_topics[*]}"
            cat gazebo-transport.log || true
            exit 1
          fi
          echo "MCA adapter state publishers discovered through Gazebo Transport"
          gazebo_cli topic -l || true

          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          echo "gz command after ROS setup: $(command -v gz)"
          echo "GZ_PARTITION after ROS setup: ${GZ_PARTITION:-<unset>}"

          env GZ_PARTITION="$GZ_PARTITION" ros2 run ros_gz_bridge parameter_bridge \
            "${topic_prefix}/cmd_effort@std_msgs/msg/Float64]gz.msgs.Double" --ros-args -r __node:=mca_ros_to_gz_bridge > ros-to-gz-bridge.log 2>&1 &
          ros_to_gz_bridge_pid=$!
          env GZ_PARTITION="$GZ_PARTITION" ros2 run ros_gz_bridge parameter_bridge \
            "${topic_prefix}/state/velocity@std_msgs/msg/Float64[gz.msgs.Double" --ros-args -r __node:=mca_gz_to_ros_bridge > gz-to-ros-bridge.log 2>&1 &
          gz_to_ros_bridge_pid=$!
          bridge_pid="$ros_to_gz_bridge_pid $gz_to_ros_bridge_pid"

          bridge_ready=false
          for _ in $(seq 1 20); do
            ros_subscribers="$(ros2 topic info -v "${topic_prefix}/cmd_effort" 2>/dev/null | awk '/Subscription count:/{print $3; exit}')"
            bridge_mapping_ready=false
            grep -Fq "Creating ROS->GZ Bridge:" ros-to-gz-bridge.log && bridge_mapping_ready=true
            if [ "${ros_subscribers:-0}" -ge 1 ] && [ "$bridge_mapping_ready" = true ]; then
              bridge_ready=true
              break
            fi
            sleep 1
          done
          echo "=== Bridge readiness before command publication ==="
          echo "ROS command subscribers: ${ros_subscribers:-0}"
          echo "ROS-to-Gazebo bridge mapping ready: $bridge_mapping_ready"
          if [ "$bridge_ready" != true ]; then
            echo "ROS-to-Gazebo bridge did not initialize before command publication"
            ros2 topic info -v "${topic_prefix}/cmd_effort" || true
            cat ros-to-gz-bridge.log || true
            exit 1
          fi

          # The ROS graph being ready is not sufficient: the bridge can exist
          # while its Gazebo Transport publisher has not yet discovered the
          # adapter subscription. Wait for the actual Gazebo-side subscriber
          # before sending the first command, otherwise the first and only
          # diagnostic bridge message can be dropped before plugin discovery.
          gazebo_command_subscriber_ready=false
          gazebo_command_topic_info=""
          for _ in $(seq 1 20); do
            gazebo_command_topic_info="$(gazebo_cli topic -i -t "${topic_prefix}/cmd_effort" 2>/dev/null || true)"
            # Gazebo Harmonic topic -i lists endpoint sections instead of
            # a numeric "Subscriber count" field. Count TCP endpoints only
            # inside Subscribers, excluding the bridge publisher endpoint.
            if printf '%s\n' "$gazebo_command_topic_info" | awk '
              /^Subscribers \[/ { in_subscribers=1; next }
              /^[^[:space:]]/ { if (in_subscribers) in_subscribers=0 }
              in_subscribers && /tcp:\/\// { found=1 }
              END { exit(found ? 0 : 1) }
            '; then
              gazebo_command_subscriber_ready=true
              break
            fi
            sleep 1
          done
          echo "=== Gazebo command topic readiness before command publication ==="
          printf '%s\n' "${gazebo_command_topic_info:-<unavailable>}"
          if [ "$gazebo_command_subscriber_ready" != true ]; then
            echo "Gazebo adapter command subscriber was not discovered before command publication"
            exit 1
          fi

          echo "=== Bridge logs after startup ==="
          cat ros-to-gz-bridge.log || true
          cat gz-to-ros-bridge.log || true

          # Start the state subscriber before any command is published. This
          # removes the previous one-second race in which the command publisher
          # could already be active while the ROS-side state subscriber was not.
          timeout 8s ros2 topic echo "${topic_prefix}/state/velocity" std_msgs/msg/Float64 > velocity.log 2>&1 &
          velocity_pid=$!
          # Observe measured acceleration directly on Gazebo Transport before
          # applying effort, so the test cannot miss its initial transient.
          timeout 8s env GZ_PARTITION="$GZ_PARTITION" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" \
            "$gazebo_executable" topic -e -t "${topic_prefix}/state/acceleration" > acceleration.log 2>&1 &
          acceleration_pid=$!
          sleep 1

          # Diagnostic probe must be alive before command publication so it can
          # independently prove Gazebo Transport delivery on the same partition.
          timeout 8s env GZ_PARTITION="$GZ_PARTITION" build/gazebo-adapter/mca_transport_subscriber_probe "${topic_prefix}/cmd_effort" > transport-probe.log 2>&1 &
          transport_probe_pid=$!
          sleep 1

          # Stop command publication after four seconds. Keep the state observers alive
          # long enough to cross the configured 0.5 s watchdog deadline.
          timeout 4s ros2 topic pub --rate 100 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 1.0}" > command-publisher.log 2>&1 &
          publisher_pid=$!

          for _ in $(seq 1 10); do
            grep -Fq "Passing message from ROS std_msgs/msg/Float64 to Gazebo gz.msgs.Double" ros-to-gz-bridge.log && break
            sleep 1
          done
          echo "=== ROS-to-Gazebo first-message status ==="
          grep -F "Passing message from ROS std_msgs/msg/Float64 to Gazebo gz.msgs.Double" ros-to-gz-bridge.log || true

          timeout 10s env GZ_PARTITION="$GZ_PARTITION" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" "$gazebo_executable" topic -e -t "${topic_prefix}/cmd_effort" > gz-command-echo.log 2>&1 &
          command_echo_pid=$!

          wait "$publisher_pid" || true
          publisher_pid=""

          # Send malformed values only after a valid command stream has stopped.
          # The NaN stream lasts approximately 0.5 s, matching the watchdog
          # timeout. The watchdog must expire during that stream, proving that
          # rejected traffic does not refresh the last-valid-command timestamp.
          env GZ_PARTITION="$GZ_PARTITION" build/gazebo-adapter/mca_transport_command_publisher \
            "${topic_prefix}/cmd_effort" nan > malformed-nan-publisher.log 2>&1
          cat malformed-nan-publisher.log
          nan_watchdog_expired=false
          for _ in $(seq 1 10); do
            watchdog_count="$(grep -Fc "MCA Gazebo adapter transport watchdog expired" gazebo-transport.log || true)"
            if [ "${watchdog_count:-0}" -ge 1 ]; then
              nan_watchdog_expired=true
              break
            fi
            sleep 0.05
          done
          if [ "$nan_watchdog_expired" != true ]; then
            echo "NaN transport traffic refreshed the watchdog or was not rejected"
            exit 1
          fi

          # Re-arm with a valid command, then repeat the same deadline test for
          # infinity. This independently verifies both non-finite encodings.
          timeout 2s ros2 topic pub --rate 100 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 1.0}" > inf-watchdog-probe-publisher.log 2>&1 &
          publisher_pid=$!
          inf_probe_received=false
          for _ in $(seq 1 60); do
            watchdog_rearm_count="$(grep -Fc "MCA Gazebo adapter transport watchdog re-armed by valid command" gazebo-transport.log || true)"
            if [ "${watchdog_rearm_count:-0}" -ge 1 ]; then
              inf_probe_received=true
              break
            fi
            sleep 0.1
          done
          if [ "$inf_probe_received" != true ]; then
            echo "Plugin did not acknowledge the valid command before the infinity watchdog test"
            exit 1
          fi
          kill -INT "$publisher_pid" 2>/dev/null || true
          wait "$publisher_pid" 2>/dev/null || true
          publisher_pid=""
          env GZ_PARTITION="$GZ_PARTITION" build/gazebo-adapter/mca_transport_command_publisher \
            "${topic_prefix}/cmd_effort" inf > malformed-inf-publisher.log 2>&1
          cat malformed-inf-publisher.log
          inf_watchdog_expired=false
          for _ in $(seq 1 10); do
            watchdog_count="$(grep -Fc "MCA Gazebo adapter transport watchdog expired" gazebo-transport.log || true)"
            if [ "${watchdog_count:-0}" -ge 2 ]; then
              inf_watchdog_expired=true
              break
            fi
            sleep 0.05
          done
          if [ "$inf_watchdog_expired" != true ]; then
            echo "Infinity transport traffic refreshed the watchdog or was not rejected"
            exit 1
          fi

          # Re-arm the same command stream and wait for an explicit
          # plugin-side acknowledgement before requesting Reset. Do not infer
          # delivery from ros2 topic pub output: the bridge may still be flushing.
          sleep 0.7
          ros2 topic pub --rate 100 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 1.0}" > reset-probe-publisher.log 2>&1 &
          publisher_pid=$!
          reset_probe_received=false
          for _ in $(seq 1 60); do
            watchdog_rearm_count="$(grep -Fc "MCA Gazebo adapter transport watchdog re-armed by valid command" gazebo-transport.log || true)"
            if [ "${watchdog_rearm_count:-0}" -ge 2 ]; then
              reset_probe_received=true
              break
            fi
            sleep 0.1
          done
          if [ "$reset_probe_received" != true ]; then
            echo "Plugin did not acknowledge a new command after watchdog expiry; refusing to run Reset precondition"
            exit 1
          fi

          # Freeze the pre-reset stream once the plugin has acknowledged an
          # active command. Reset must see the still-fresh command, but no
          # continuously generated 1.0 messages should cross the reset boundary.
          kill -INT "$publisher_pid" 2>/dev/null || true
          wait "$publisher_pid" 2>/dev/null || true
          publisher_pid=""

          echo "=== Reset Gazebo world through WorldControl with an active command ==="
          if ! gazebo_cli service -s /world/mca_gazebo_smoke/control \
              --reqtype gz.msgs.WorldControl --reptype gz.msgs.Boolean \
              --timeout 3000 --req 'reset: {all: true}' > reset-response.log 2>&1; then
            cat reset-response.log || true
            echo "Gazebo world reset service call failed"
            exit 1
          fi
          cat reset-response.log
          if ! grep -Eq 'data:[[:space:]]*true' reset-response.log; then
            echo "Gazebo world reset service did not return data: true"
            exit 1
          fi

          reset_callback_seen=false
          for _ in $(seq 1 30); do
            if grep -Fq "MCA Gazebo adapter Reset completed" gazebo-transport.log; then
              reset_callback_seen=true
              break
            fi
            sleep 0.1
          done
          if [ "$reset_callback_seen" != true ]; then
            echo "Gazebo world reset succeeded but the MCA plugin Reset callback was not observed"
            exit 1
          fi

          # The first command after Reset is zero effort. Require the plugin's
          # PreUpdate diagnostic to confirm it was received fresh and applied
          # as zero before starting the physical-motion observation.
          timeout 3s ros2 topic pub --rate 100 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 0.0}" > post-reset-zero-command-publisher.log 2>&1 &
          post_reset_zero_publisher_pid=$!
          post_reset_zero_command_applied=false
          for _ in $(seq 1 60); do
            if python3 - <<'PY'
          import re
          from pathlib import Path
          raw = Path("gazebo-transport.log").read_text(errors="replace")
          plain = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", raw)
          matches = re.findall(
              r"MCA Gazebo adapter PreUpdate observed transport command=([-+0-9.eE]+) "
              r"fresh=(true|false).*?applied_effort=([-+0-9.eE]+)",
              plain,
          )
          raise SystemExit(0 if len(matches) >= 2 and matches[-1] == ("0", "true", "0") else 1)
          PY
            then
              post_reset_zero_command_applied=true
              break
            fi
            sleep 0.1
          done
          if [ "$post_reset_zero_command_applied" != true ]; then
            echo "The plugin did not confirm a fresh post-reset zero-effort command in PreUpdate"
            exit 1
          fi
          kill -INT "$post_reset_zero_publisher_pid" 2>/dev/null || true
          wait "$post_reset_zero_publisher_pid" 2>/dev/null || true
          post_reset_zero_publisher_pid=""

          reset_epoch_command_count="$(grep -Fc "MCA Gazebo adapter received typed transport effort command=" gazebo-transport.log || true)"
          if [ "${reset_epoch_command_count:-0}" -lt 3 ]; then
            echo "The Gazebo plugin did not acknowledge a command after Reset"
            exit 1
          fi

          post_reset_watchdog_expired=false
          for _ in $(seq 1 30); do
            watchdog_count="$(grep -Fc "MCA Gazebo adapter transport watchdog expired" gazebo-transport.log || true)"
            if [ "${watchdog_count:-0}" -ge 2 ]; then
              post_reset_watchdog_expired=true
              break
            fi
            sleep 0.1
          done
          if [ "$post_reset_watchdog_expired" != true ]; then
            echo "The post-reset zero-effort command did not expire before the fresh motion probe"
            exit 1
          fi
          # Open both Gazebo Transport and ROS state observers before publishing
          # the next post-reset command. This avoids missing a fast acceleration
          # transient while the rotor moves away from its reset position.
          timeout 8s env GZ_PARTITION="$GZ_PARTITION" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" \
            "$gazebo_executable" topic -e -t "${topic_prefix}/state/velocity" > post-reset-gz-velocity.log 2>&1 &
          post_reset_gz_velocity_pid=$!
          timeout 8s ros2 topic echo "${topic_prefix}/state/velocity" std_msgs/msg/Float64 > post-reset-velocity.log 2>&1 &
          post_reset_velocity_pid=$!

          post_reset_gz_velocity_ready=false
          for _ in $(seq 1 30); do
            post_reset_velocity_topic_info="$(gazebo_cli topic -i -t "${topic_prefix}/state/velocity" 2>/dev/null || true)"
            if printf '%s\n' "$post_reset_velocity_topic_info" | awk '
              /^Subscribers \[/ { in_subscribers=1; next }
              /^[^[:space:]]/ { if (in_subscribers) in_subscribers=0 }
              in_subscribers && /tcp:\/\// { found=1 }
              END { exit(found ? 0 : 1) }
            '; then
              post_reset_gz_velocity_ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$post_reset_gz_velocity_ready" != true ]; then
            echo "Post-reset Gazebo velocity observer did not discover the adapter publisher"
            exit 1
          fi

          post_reset_ros_velocity_ready=false
          for _ in $(seq 1 30); do
            post_reset_ros_subscribers="$(ros2 topic info -v "${topic_prefix}/state/velocity" 2>/dev/null | awk '/Subscription count:/{print $3; exit}')"
            if [ "${post_reset_ros_subscribers:-0}" -ge 1 ]; then
              post_reset_ros_velocity_ready=true
              break
            fi
            sleep 0.1
          done
          if [ "$post_reset_ros_velocity_ready" != true ]; then
            echo "Post-reset ROS velocity observer did not join the state topic"
            exit 1
          fi

          # Now issue a distinct command only after both state observers are live.
          timeout 4s ros2 topic pub --rate 100 "${topic_prefix}/cmd_effort" std_msgs/msg/Float64 "{data: 1.0}" > post-reset-command-publisher.log 2>&1 &
          post_reset_publisher_pid=$!
          post_reset_command_received=false
          for _ in $(seq 1 60); do
            reset_epoch_command_count="$(grep -Fc "MCA Gazebo adapter received typed transport effort command=" gazebo-transport.log || true)"
            if [ "${reset_epoch_command_count:-0}" -ge 4 ]; then
              post_reset_command_received=true
              break
            fi
            sleep 0.1
          done
          if [ "$post_reset_command_received" != true ]; then
            echo "The Gazebo plugin did not acknowledge the fresh post-reset motion command"
            exit 1
          fi
          wait "$post_reset_publisher_pid" || true
          post_reset_publisher_pid=""
          wait "$post_reset_velocity_pid" || true
          post_reset_velocity_pid=""
          wait "$post_reset_gz_velocity_pid" || true
          post_reset_gz_velocity_pid=""

          wait "$velocity_pid" || true
          wait "$acceleration_pid" || true
          wait "$transport_probe_pid" || true

          echo "=== ROS command topic graph after publisher ==="
          ros2 topic info -v "${topic_prefix}/cmd_effort" || true
          echo "=== Gazebo command topic echo ==="
          cat gz-command-echo.log || true
          echo "=== Independent C++ Gazebo Transport subscriber probe (diagnostic only) ==="
          cat transport-probe.log || true
          echo "=== ROS publisher log ==="
          cat command-publisher.log || true
          echo "=== Reset probe publisher log ==="
          cat reset-probe-publisher.log || true
          echo "=== Post-reset ROS velocity samples ==="
          cat post-reset-velocity.log || true
          echo "=== Post-reset Gazebo Transport velocity samples ==="
          cat post-reset-gz-velocity.log || true
          echo "=== Post-reset zero-effort publisher log ==="
          cat post-reset-zero-command-publisher.log || true
          echo "=== Post-reset command publisher log ==="
          cat post-reset-command-publisher.log || true
          echo "=== Gazebo reset service response ==="
          cat reset-response.log || true
          echo "=== ROS -> Gazebo bridge log ==="
          cat ros-to-gz-bridge.log || true
          echo "=== Gazebo -> ROS bridge log ==="
          cat gz-to-ros-bridge.log || true

          # Snapshot the actual Gazebo process (not a strace wrapper) before
          # shutdown. This captures all threads and their wait channels.
          echo "=== Gazebo process and thread state before shutdown ==="
          ps -eLo pid,ppid,tid,stat,pcpu,wchan:32,comm,args -p "$gz_pid" || true
          echo "=== Gazebo server thread wait channels ==="
          for task_file in /proc/"$gz_pid"/task/*/wchan; do
            [ -r "$task_file" ] || continue
            printf '%s: ' "$task_file"
            cat "$task_file" || true
            printf '\n'
          done

          # Require SIGINT shutdown to complete without SIGKILL. Treat a
          # zombie as exited (it is waiting only for the shell to reap it).
          stop_gazebo_gracefully() {
            local pid="$1"
            local label="$2"
            local process_state=""
            local wait_status=0
            kill -INT "$pid" 2>/dev/null || true
            for _ in $(seq 1 10); do
              process_state="$(ps -o stat= -p "$pid" 2>/dev/null || true)"
              if [ -z "$process_state" ] || [[ "$process_state" == Z* ]]; then
                break
              fi
              sleep 1
            done
            process_state="$(ps -o stat= -p "$pid" 2>/dev/null || true)"
            if [ -n "$process_state" ] && [[ "$process_state" != Z* ]]; then
              echo "$label did not exit after SIGINT (state=$process_state); refusing forced termination"
              return 1
            fi
            wait "$pid" 2>/dev/null || wait_status=$?
            if [ "$wait_status" -ne 0 ] && [ "$wait_status" -ne 130 ]; then
              echo "$label exited with unexpected status $wait_status after SIGINT"
              return 1
            fi
            echo "$label exited after SIGINT without SIGKILL (wait_status=$wait_status)"
          }

          # Stop Gazebo after traffic collection and then read its final log.
          # This avoids testing against a partial log snapshot while the server
          # and its transport receiver are still running.
          echo "=== Gracefully stop Gazebo before reading final runtime log ==="
          stop_gazebo_gracefully "$gz_pid" "Initial Gazebo instance"
          gz_pid=""

          echo "=== Gazebo runtime log after shutdown ==="
          cat gazebo-transport.log || true
          echo "=== ROS velocity samples ==="
          cat velocity.log || true
          echo "=== Gazebo joint acceleration samples ==="
          cat acceleration.log || true

          # Gazebo Console inserts ANSI color sequences into GZ_VERBOSE=1 log
          # tokens (for example between "command=" and "1"). Preserve the raw
          # log above, but normalize CSI sequences before fixed-string asserts.
          python3 - <<'PY'
          import re
          from pathlib import Path

          raw_log = Path("gazebo-transport.log").read_text(errors="replace")
          ansi_csi = re.compile(re.escape(chr(27)) + re.escape("[") + r"[0-?]*[ -/]*[@-~]")
          plain_log = ansi_csi.sub("", raw_log)
          Path("gazebo-transport.plain.log").write_text(plain_log)
          PY

          # Require the plugin to report the watchdog transition only after its
          # configured wall-clock deadline, with zero effort written to the joint.
          python3 - <<'PY'
          import re
          from pathlib import Path

          plain_log = Path("gazebo-transport.plain.log").read_text(errors="replace")
          pattern = re.compile(
              r"MCA Gazebo adapter transport watchdog expired age_s=([-+0-9.eE]+) "
              r"timeout_s=([-+0-9.eE]+) applied_effort=([-+0-9.eE]+)"
          )
          matches = pattern.findall(plain_log)
          if not matches:
              raise SystemExit("Gazebo adapter did not report transport watchdog expiry")
          age_s, timeout_s, applied_effort = map(float, matches[-1])
          if age_s < timeout_s:
              raise SystemExit(
                  f"Watchdog expired before its deadline: age={age_s}, timeout={timeout_s}"
              )
          if abs(applied_effort) > 1e-12:
              raise SystemExit(
                  f"Watchdog expiry did not result in zero effort: {applied_effort}"
              )
          print(
              f"Gazebo transport watchdog passed: age={age_s:.6f}s, "
              f"timeout={timeout_s:.6f}s, applied_effort={applied_effort}"
          )
          PY

          # Missing model-joint configuration must fail loudly with the
          # model and requested joint name; a missing required SDF field must
          # identify the model entity and field.
          if ! grep -Fq "configuration rejected: joint not found model=missing_joint_smoke joint_name=joint_that_does_not_exist" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not diagnose a missing joint with actionable context"
            exit 1
          fi
          if ! grep -Fq "configuration rejected: required <joint_name> element is missing" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not diagnose a missing joint_name element"
            exit 1
          fi

          # Require the plugin to reject both NaN and infinity at its
          # actual Gazebo Transport callback boundary. The second rejection
          # proves repeated malformed input is counted while diagnostics stay
          # rate-limited (the first two counts are always logged).
          if ! grep -Fq "MCA Gazebo adapter rejected non-finite transport effort command" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not diagnose a non-finite transport command"
            exit 1
          fi
          if ! grep -Fq "rejected_count=2" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not count repeated non-finite transport commands"
            exit 1
          fi

          # Keep the four real E2E assertions unchanged. Diagnostic ordering is
          # bridge -> plugin callback -> non-zero force -> ROS velocity, so a
          # failure identifies the broken layer without weakening acceptance.
          if ! grep -Fq "Passing message from ROS std_msgs/msg/Float64 to Gazebo gz.msgs.Double" ros-to-gz-bridge.log; then
            echo "ROS-to-Gazebo bridge did not confirm forwarding a command message"
            exit 1
          fi
          if ! grep -Fq "MCA Gazebo adapter received typed transport effort command=1" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not log receipt of the ROS-bridged effort command"
            exit 1
          fi
          if ! grep -Fq "MCA Gazebo adapter applied non-zero JointForceCmd=" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not log application of a non-zero JointForceCmd"
            exit 1
          fi
          if ! grep -Eq 'data: [-+]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][-+]?[0-9]+)?' velocity.log; then
            echo "No ROS 2 velocity state was observed through ros_gz_bridge"
            exit 1
          fi
          if ! awk '/data:/{v=$2; if (v+0 > 1e-5 || v+0 < -1e-5) {found=1}} END{exit(found ? 0 : 1)}' velocity.log; then
            echo "ROS 2 effort command did not produce velocity above the 1e-5 threshold"
            exit 1
          fi
          if ! grep -Eq 'data: [-+]?([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][-+]?[0-9]+)?' acceleration.log; then
            echo "No measured Gazebo joint acceleration was observed"
            exit 1
          fi
          if ! awk '/data:/{v=$2; if (v+0 > 1e-5 || v+0 < -1e-5) {found=1}} END{exit(found ? 0 : 1)}' acceleration.log; then
            echo "Gazebo joint acceleration remained at or below the 1e-5 threshold"
            exit 1
          fi
          reset_count="$(grep -Fc "MCA Gazebo adapter Reset completed" gazebo-transport.plain.log || true)"
          if [ "$reset_count" -lt 1 ] || ! grep -Eq 'MCA Gazebo adapter Reset completed .*had_transport_command=true applied_effort=0 step_index=0 state_valid=false force_component_available=true' gazebo-transport.plain.log; then
            echo "Gazebo adapter Reset did not confirm clearing a fresh command and zeroing JointForceCmd"
            exit 1
          fi
          callback_count="$(grep -Fc "MCA Gazebo adapter received typed transport effort command=" gazebo-transport.plain.log || true)"
          if [ "$callback_count" -lt 4 ]; then
            echo "Gazebo adapter did not receive the initial, pre-reset, post-reset zero-effort, and fresh motion commands"
            exit 1
          fi
          if ! grep -Fq "MCA Gazebo adapter received typed transport effort command=0" gazebo-transport.plain.log; then
            echo "Gazebo adapter did not receive the required post-reset zero-effort command"
            exit 1
          fi
          if ! grep -Eq 'MCA Gazebo adapter PreUpdate observed transport command=0 fresh=true .*applied_effort=0([.]0*)?([[:space:]]|$)' gazebo-transport.plain.log; then
            echo "Gazebo adapter did not apply zero effort after Reset"
            exit 1
          fi
          nonzero_force_count="$(grep -Fc "MCA Gazebo adapter applied non-zero JointForceCmd=" gazebo-transport.plain.log || true)"
          if [ "$nonzero_force_count" -lt 2 ]; then
            echo "Gazebo adapter did not apply non-zero effort both before and after Reset"
            exit 1
          fi
          if ! awk '/data:/{v=$2; if (v+0 > 1e-5 || v+0 < -1e-5) {found=1}} END{exit(found ? 0 : 1)}' post-reset-gz-velocity.log; then
            echo "Gazebo Transport joint velocity did not become non-zero after Reset"
            exit 1
          fi
          if ! awk '/data:/{v=$2; if (v+0 > 1e-5 || v+0 < -1e-5) {found=1}} END{exit(found ? 0 : 1)}' post-reset-velocity.log; then
            echo "ROS 2 velocity state did not resume after Gazebo Reset"
            exit 1
          fi
          # Re-launch the same world in the same transport partition after
          # the first server has exited. This catches stale endpoints, plugin
          # teardown leaks, and one-shot initialization assumptions.
          echo "=== Relaunch Gazebo world after graceful shutdown ==="
          env GZ_VERBOSE=1 GZ_PARTITION="$GZ_PARTITION" GZ_SIM_SYSTEM_PLUGIN_PATH="$PWD/build/gazebo-adapter:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}" PATH="$gazebo_path" LD_LIBRARY_PATH="$gazebo_ld_library_path" \
            "$gazebo_executable" sim -s -r -v 4 gazebo/mca_gazebo_adapter/test/worlds/single_axis_smoke.sdf > gazebo-relaunch.log 2>&1 &
          gz_pid=$!
          relaunch_ready=false
          for _ in $(seq 1 60); do
            if grep -F "MCA Gazebo adapter configured command topic=${topic_prefix}/cmd_effort" gazebo-relaunch.log | grep -Fq "configured=true"; then
              relaunch_topics="$(gazebo_cli topic -l 2>/dev/null || true)"
              if printf '%s\n' "$relaunch_topics" | grep -Fxq "${topic_prefix}/state/velocity"; then
                relaunch_ready=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$relaunch_ready" != true ]; then
            echo "Gazebo adapter did not configure and republish state topics after a second world launch"
            cat gazebo-relaunch.log || true
            exit 1
          fi
          relaunch_command_info="$(gazebo_cli topic -i -t "${topic_prefix}/cmd_effort" 2>/dev/null || true)"
          if ! printf '%s\n' "$relaunch_command_info" | awk '
            /^Subscribers \[/ { in_subscribers=1; next }
            /^[^[:space:]]/ { if (in_subscribers) in_subscribers=0 }
            in_subscribers && /tcp:\/\// { found=1 }
            END { exit(found ? 0 : 1) }
          '; then
            echo "Gazebo adapter command subscriber was not recreated after world relaunch"
            printf '%s\n' "$relaunch_command_info"
            exit 1
          fi
          stop_gazebo_gracefully "$gz_pid" "Relaunched Gazebo instance"
          gz_pid=""
          echo "Gazebo repeated world/plugin launch and graceful shutdown passed"

          echo "ROS 2 ↔ Gazebo bridge command/state path passed: bridge forwarding, plugin callback, non-zero JointForceCmd, velocity > 1e-5, measured acceleration > 1e-5, watchdog zero-effort expiry, Reset clears an active command, and post-reset command produces measured velocity on Gazebo Transport and ROS 2"
