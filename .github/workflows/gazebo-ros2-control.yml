name: gazebo-ros2-control

concurrency:
  group: gazebo-ros2-control-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ros2/mca_gz_ros2_control_adapter/**"
      - "include/mca/hardware/**"
      - ".github/workflows/gazebo-ros2-control.yml"
  pull_request:
    paths:
      - "ros2/mca_gz_ros2_control_adapter/**"
      - "include/mca/hardware/**"
      - ".github/workflows/gazebo-ros2-control.yml"

jobs:
  closed-loop:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install Gazebo Harmonic and ros2_control dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg cmake g++ pkg-config
          curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable $(. /etc/os-release && echo ${UBUNTU_CODENAME}) main" > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y --no-install-recommends \
            gz-harmonic libgz-sim8-dev libgz-plugin2-dev libgz-common5-dev \
            libgz-math7-dev libgz-transport13-dev libgz-msgs10-dev \
            ros-jazzy-gz-ros2-control ros-jazzy-controller-manager ros-jazzy-ros2controlcli \
            ros-jazzy-forward-command-controller ros-jazzy-joint-state-broadcaster \
            ros-jazzy-ament-cmake-gtest ros-jazzy-robot-state-publisher ros-jazzy-ros-gz-bridge

      - name: Build MCA Gazebo ros2_control adapter
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          package_list="$(colcon list --base-paths ros2)"
          printf '%s\n' "$package_list"
          printf '%s\n' "$package_list" | awk '{print $1}' | grep -Fxq mca_gz_ros2_control_adapter
          colcon build --base-paths ros2 --packages-select mca_gz_ros2_control_adapter --merge-install
          test -f install/lib/libmca_gz_ros2_control_adapter.so
          set +u
          source install/setup.bash
          set -u

      - name: Run live controller_manager closed-loop acceptance
        shell: bash
        run: |
          set -eo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set -u
          ros2 control --help >/dev/null

          export ROS_DOMAIN_ID=47
          export GZ_PARTITION="mca-ros2-control-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
          export GZ_SIM_SYSTEM_PLUGIN_PATH="$GITHUB_WORKSPACE/install/lib:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}"
          world_source="$GITHUB_WORKSPACE/ros2/mca_gz_ros2_control_adapter/test/worlds/closed_loop.sdf"
          config="$GITHUB_WORKSPACE/ros2/mca_gz_ros2_control_adapter/test/closed_loop_controller.yaml"
          urdf="$GITHUB_WORKSPACE/ros2/mca_gz_ros2_control_adapter/test/closed_loop_robot.urdf"
          robot_description_params="$RUNNER_TEMP/robot_state_publisher.yaml"
          robot_state_publisher_log="$GITHUB_WORKSPACE/robot-state-publisher.log"
          world="$RUNNER_TEMP/mca_ros2_control_closed_loop_runtime.sdf"
          gazebo_log="$GITHUB_WORKSPACE/gazebo-ros2-control.log"
          state_log="$GITHUB_WORKSPACE/joint-states.log"

          # Preserve the simulator's own diagnostics when any acceptance
          # assertion fails; otherwise the redirected Gazebo log is lost.
          dump_failure_diagnostics() {
            status=$?
            echo "=== Gazebo / robot_state_publisher logs after acceptance failure ==="
            if [ -f "$gazebo_log" ]; then tail -n 300 "$gazebo_log"; fi
            if [ -f "$robot_state_publisher_log" ]; then
              tail -n 100 "$robot_state_publisher_log"
            fi
            if [ -f "$state_log" ]; then
              echo "=== Joint state subscriber output ==="
              tail -n 100 "$state_log"
            fi
            if [ -f "$clock_bridge_log" ]; then
              echo "=== Clock bridge output ==="
              tail -n 80 "$clock_bridge_log"
            fi
            exit "$status"
          }
          trap dump_failure_diagnostics ERR

          echo "=== Closed-loop fixture paths ==="
          printf 'world_source=%s\nconfig=%s\nworld_runtime=%s\n' "$world_source" "$config" "$world"
          test -f "$world_source"
          test -f "$config"
          test -f "$urdf"
          # The Jazzy gz_ros2_control plugin passes <parameters> directly to rclcpp;
          # it does not expand the $(find package) syntax shown in its documentation.
          # Materialize the checked-in SDF with an absolute controller YAML path so
          # the acceptance test is independent of the process working directory.
          python3 - "$world_source" "$world" "$config" <<'PY'
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          config = sys.argv[3]
          token = "$(find mca_gz_ros2_control_adapter)/test/closed_loop_controller.yaml"
          if source.count(token) != 1:
              raise SystemExit(f"expected exactly one controller config token, found {source.count(token)}")
          output.write_text(source.replace(token, config, 1))
          PY
          grep -F "<parameters>$config</parameters>" "$world"

          # Prepare the robot description, but do not publish it until the
          # Gazebo -> ROS clock bridge is live. The controller manager and
          # broadcasters use_sim_time=true and otherwise cannot advance timers.
          python3 - "$urdf" "$robot_description_params" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          description = Path(sys.argv[1]).read_text()
          params = {
              "robot_state_publisher": {
                  "ros__parameters": {"robot_description": description}
              }
          }
          Path(sys.argv[2]).write_text(yaml.safe_dump(params, sort_keys=False))
          PY

          # Publish the transient-local URDF before Gazebo starts. The
          # gz_ros2_control plugin waits for robot_description during Configure;
          # delaying this publisher would block world startup and its clock.
          ros2 run robot_state_publisher robot_state_publisher --ros-args --params-file "$robot_description_params" >"$robot_state_publisher_log" 2>&1 &
          rsp_pid=$!
          robot_description_ready=false
          for _ in $(seq 1 20); do
            if ! kill -0 "$rsp_pid" 2>/dev/null; then
              echo "robot_state_publisher exited before publishing robot_description"
              cat "$robot_state_publisher_log" || true
              exit 1
            fi
            if ros2 topic info /robot_description 2>/dev/null | grep -Eq 'Publisher count: [1-9]'; then
              robot_description_ready=true
              break
            fi
            sleep 1
          done
          if [ "$robot_description_ready" != true ]; then
            echo "robot_state_publisher did not publish /robot_description"
            cat "$robot_state_publisher_log" || true
            exit 1
          fi
          echo "=== robot_description publisher ==="
          ros2 topic info -v /robot_description

          # Start a bridge for Gazebo Harmonic's world-scoped clock before
          # starting the server, so ROS /clock is available as soon as the
          # simulation begins advancing.
          clock_bridge_log="$GITHUB_WORKSPACE/clock-bridge.log"
          clock_bridge_config="$RUNNER_TEMP/clock_bridge.yaml"
          cat >"$clock_bridge_config" <<'YAML'
          - ros_topic_name: "/clock"
            gz_topic_name: "/world/mca_ros2_control_closed_loop/clock"
            ros_type_name: "rosgraph_msgs/msg/Clock"
            gz_type_name: "gz.msgs.Clock"
            direction: GZ_TO_ROS
            lazy: false
          YAML
          ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:="$clock_bridge_config" >"$clock_bridge_log" 2>&1 &
          clock_bridge_pid=$!

          cd "$GITHUB_WORKSPACE"
          gz sim -s -r -v 4 "$world" >"$gazebo_log" 2>&1 &
          gz_pid=$!

          cleanup() {
            if [ -n "${rsp_pid:-}" ]; then
              kill "$rsp_pid" 2>/dev/null || true
              wait "$rsp_pid" 2>/dev/null || true
            fi
            if [ -n "${state_pid:-}" ]; then
              kill "$state_pid" 2>/dev/null || true
              wait "$state_pid" 2>/dev/null || true
            fi
            if [ -n "${publisher_pid:-}" ]; then
              kill "$publisher_pid" 2>/dev/null || true
              wait "$publisher_pid" 2>/dev/null || true
            fi
            if [ -n "${clock_bridge_pid:-}" ]; then
              kill "$clock_bridge_pid" 2>/dev/null || true
              wait "$clock_bridge_pid" 2>/dev/null || true
            fi
            if [ -n "${gz_pid:-}" ]; then
              kill -INT "$gz_pid" 2>/dev/null || true
              for _ in $(seq 1 5); do
                kill -0 "$gz_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$gz_pid" 2>/dev/null || true
              wait "$gz_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "=== Waiting for Gazebo world clock transport topic ==="
          gz_clock_topic="/world/mca_ros2_control_closed_loop/clock"
          gz_clock_ready=false
          for _ in $(seq 1 30); do
            if ! kill -0 "$gz_pid" 2>/dev/null; then
              echo "Gazebo exited before creating its world clock topic"
              cat "$gazebo_log" || true
              exit 1
            fi
            if timeout 3s gz topic -l 2>/dev/null | grep -Fxq "$gz_clock_topic"; then
              gz_clock_ready=true
              break
            fi
            sleep 1
          done
          if [ "$gz_clock_ready" != true ]; then
            echo "Gazebo world clock topic '$gz_clock_topic' was not found"
            timeout 5s gz topic -l || true
            cat "$gazebo_log" || true
            exit 1
          fi

          echo "=== Waiting for Gazebo ROS clock bridge ==="
          clock_ready=false
          for _ in $(seq 1 30); do
            if ! kill -0 "$clock_bridge_pid" 2>/dev/null; then
              echo "ros_gz_bridge exited before bridging the world clock"
              cat "$clock_bridge_log" || true
              exit 1
            fi
            if timeout 2s ros2 topic echo /clock rosgraph_msgs/msg/Clock --once >"$GITHUB_WORKSPACE/clock-sample.log" 2>&1; then
              clock_ready=true
              break
            fi
            sleep 1
          done
          if [ "$clock_ready" != true ]; then
            echo "ROS /clock did not receive a Gazebo world clock sample"
            cat "$clock_bridge_log" || true
            cat "$gazebo_log" || true
            exit 1
          fi
          echo "=== ROS /clock bridge is publishing ==="
          ros2 topic info -v /clock
          cat "$GITHUB_WORKSPACE/clock-sample.log"

          echo "=== Waiting for controller_manager ==="
          manager_ready=false
          for _ in $(seq 1 60); do
            if ros2 service list 2>/dev/null | grep -Fxq '/controller_manager/list_controllers'; then
              manager_ready=true
              break
            fi
            kill -0 "$gz_pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$manager_ready" != true ]; then
            echo "controller_manager did not become available"
            cat "$gazebo_log" || true
            exit 1
          fi

          echo "=== Hardware before controller activation ==="
          ros2 control list_hardware_components --verbose
          ros2 control list_hardware_interfaces --verbose
          ros2 control list_hardware_components --verbose | grep -A8 -F 'name: McaGazeboSystem' | grep -F 'label=active'

          echo "=== Loading controllers ==="
          ros2 run controller_manager spawner joint_state_broadcaster \
            --controller-manager /controller_manager \
            --param-file "$config" \
            --controller-manager-timeout 30
          ros2 run controller_manager spawner effort_controller \
            --controller-manager /controller_manager \
            --param-file "$config" \
            --controller-manager-timeout 30
          ros2 control list_controllers
          ros2 control list_controllers | grep -F 'joint_state_broadcaster' | grep -F 'active'
          ros2 control list_controllers | grep -F 'effort_controller' | grep -F 'active'

          echo "=== Joint state topic QoS ==="
          ros2 topic info -v /joint_states
          # The Gazebo fixture may start at any valid joint position. A fixed
          # positive effort can therefore push a joint already at +limit into
          # its stop and falsely report a broken command path. Read the actual
          # starting state and command each joint toward the center of its
          # travel so this acceptance test is independent of startup pose.
          initial_state_log="$GITHUB_WORKSPACE/initial-joint-state.log"
          timeout 5s ros2 topic echo /joint_states sensor_msgs/msg/JointState \
            --qos-reliability best_effort --once >"$initial_state_log" 2>&1
          read -r effort_a effort_b < <(python3 - "$initial_state_log" <<'PY'
          import math
          import sys
          from pathlib import Path
          import yaml

          messages = [m for m in yaml.safe_load_all(Path(sys.argv[1]).read_text(errors="replace"))
                      if isinstance(m, dict)]
          if not messages:
              raise SystemExit("no initial joint state message received")
          message = messages[-1]
          names = message.get("name", [])
          values = message.get("position", [])
          by_name = dict(zip(names, values))
          try:
              positions = [float(by_name["joint_a"]), float(by_name["joint_b"])]
          except (KeyError, TypeError, ValueError) as error:
              raise SystemExit(f"initial joint state is incomplete: {error}")
          if not all(math.isfinite(value) for value in positions):
              raise SystemExit(f"initial joint state is non-finite: {positions}")
          efforts = [-1.0 if value > 0.0 else 1.0 for value in positions]
          print(*efforts)
          print(f"initial_joint_positions={positions}", file=sys.stderr)
          print(f"selected_effort_command={efforts}", file=sys.stderr)
          PY
          )
          echo "=== Capturing joint state while applying effort ==="
          # A best-effort subscriber is compatible with both best-effort and
          # reliable publishers; the CLI's default reliable request may not
          # match a sensor-data publisher.
          timeout 7s ros2 topic echo /joint_states sensor_msgs/msg/JointState --qos-reliability best_effort >"$state_log" 2>&1 &
          state_pid=$!
          sleep 1
          timeout 4s ros2 topic pub --rate 100 /effort_controller/commands \
            std_msgs/msg/Float64MultiArray "{data: [$effort_a, $effort_b]}" > command-publisher.log 2>&1 &
          publisher_pid=$!
          wait "$publisher_pid" || true
          sleep 1

          python3 - "$state_log" <<'PY'
          import math
          import sys
          from pathlib import Path
          import yaml

          text = Path(sys.argv[1]).read_text(errors="replace")
          positions = []
          for message in yaml.safe_load_all(text):
              if not isinstance(message, dict):
                  continue
              names = message.get("name", [])
              values = message.get("position", [])
              if not isinstance(names, list) or not isinstance(values, list):
                  continue
              if len(names) != len(values) or not {"joint_a", "joint_b"}.issubset(names):
                  continue
              by_name = dict(zip(names, values))
              sample = [float(by_name["joint_a"]), float(by_name["joint_b"])]
              if all(math.isfinite(value) for value in sample):
                  positions.append(sample)
          if len(positions) < 5:
              raise SystemExit(f"insufficient valid joint state samples: {len(positions)}")
          first = positions[0]
          last = positions[-1]
          delta = [abs(last[i] - first[i]) for i in range(2)]
          print(f"valid_joint_state_samples={len(positions)}")
          print(f"first_position={first}")
          print(f"last_position={last}")
          print(f"absolute_delta={delta}")
          if max(delta) < 1.0e-4:
              raise SystemExit("closed-loop effort command produced no measurable joint motion")
          PY

          # Jazzy's manual set_hardware_component_state transition does not
          # automatically deactivate controllers that claim the component's
          # interfaces (see ros-controls/ros2_control#3444). Stop every
          # dependent controller explicitly before taking hardware offline.
          echo "=== Deactivating controllers before hardware ==="
          ros2 control set_controller_state effort_controller inactive
          ros2 control set_controller_state joint_state_broadcaster inactive
          ros2 control list_controllers
          ros2 control list_controllers | grep -F 'effort_controller' | grep -F 'inactive'
          ros2 control list_controllers | grep -F 'joint_state_broadcaster' | grep -F 'inactive'

          echo "=== Deactivating hardware through controller_manager ==="
          ros2 control set_hardware_component_state McaGazeboSystem inactive
          ros2 control list_hardware_components --verbose
          ros2 control list_hardware_components --verbose | grep -A8 -F 'name: McaGazeboSystem' | grep -F 'label=inactive'
          ros2 control list_controllers | grep -F 'effort_controller' | grep -F 'inactive'
          ros2 control list_controllers | grep -F 'joint_state_broadcaster' | grep -F 'inactive'

          echo "=== Re-activating hardware ==="
          ros2 control set_hardware_component_state McaGazeboSystem active
          ros2 control list_hardware_components --verbose | grep -A8 -F 'name: McaGazeboSystem' | grep -F 'label=active'

          echo "=== Re-activating controllers ==="
          ros2 control set_controller_state joint_state_broadcaster active
          ros2 control set_controller_state effort_controller active
          ros2 control list_controllers | grep -F 'joint_state_broadcaster' | grep -F 'active'
          ros2 control list_controllers | grep -F 'effort_controller' | grep -F 'active'

          echo "=== Gazebo / controller_manager diagnostics ==="
          grep -Ei 'error|exception|failed|fatal|mca_gz_ros2_control_adapter|GazeboSystem' "$gazebo_log" | tail -n 120 || true
          if grep -Eiq 'Segmentation fault|AddressSanitizer|terminate called|uncaught exception' "$gazebo_log"; then
            echo "Gazebo/controller_manager reported a fatal runtime failure"
            exit 1
          fi

          echo "Live Gazebo + controller_manager closed-loop acceptance passed"
