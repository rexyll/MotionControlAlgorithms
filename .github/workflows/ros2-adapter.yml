name: ros2-adapter

concurrency:
  group: ros2-adapter-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ros2/mca_ros2_adapter/**"
      - "ros2/mca_ros2_control_adapter/**"
      - "include/mca/hardware/**"
      - "include/mca/simulation/**"
      - ".github/workflows/ros2-adapter.yml"
  pull_request:
    paths:
      - "ros2/mca_ros2_adapter/**"
      - "include/mca/simulation/**"
      - ".github/workflows/ros2-adapter.yml"

jobs:
  ros2-jazzy-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libeigen3-dev \
            python3-colcon-common-extensions \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-hardware-interface \
            ros-jazzy-pluginlib
      - name: Build optional adapter package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2 --packages-select mca_ros2_adapter mca_ros2_control_adapter --event-handlers console_direct+
      - name: Test optional adapter package
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --base-paths ros2 --packages-select mca_ros2_adapter mca_ros2_control_adapter --event-handlers console_direct+
          colcon test-result --test-result-base build/mca_ros2_adapter/test_results --verbose
          colcon test-result --test-result-base build/mca_ros2_control_adapter/test_results --verbose
